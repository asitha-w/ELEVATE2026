<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{width:7680px;height:4320px;overflow:hidden}
  body{width:1920px;height:1080px;overflow:hidden;transform:scale(4);transform-origin:0 0;
       font-family:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;color:#fff;position:relative}

  body{background:radial-gradient(1600px 900px at 50% 56%,#241a44 0%,#150f26 55%,#0c0817 100%)}
  svg.tunnel{position:absolute;inset:0}
  .vpglow{position:absolute;left:50%;top:600px;width:520px;height:340px;transform:translate(-50%,-50%);
         background:radial-gradient(ellipse,rgba(190,160,255,.55) 0%,rgba(122,92,214,.18) 45%,transparent 70%)}
  .star{position:absolute;left:50%;top:600px;width:74px;height:74px;transform:translate(-50%,-50%);
       background:linear-gradient(180deg,#fff,#a988ec);
       clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
       filter:drop-shadow(0 0 30px rgba(190,160,255,.95))}
  .logo{position:absolute;left:50%;top:74px;transform:translateX(-50%);width:640px}
  .logo img{width:100%}
  .tag{position:absolute;left:50%;top:308px;transform:translateX(-50%);font-size:24px;font-weight:800;
      letter-spacing:.5em;text-transform:uppercase;color:#cbb8f2;text-indent:.5em;white-space:nowrap;
      text-shadow:0 2px 22px rgba(12,8,23,.9)}
  .robot{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:330px}
  .robot img{width:100%;display:block;filter:drop-shadow(0 0 60px rgba(122,92,214,.5))}
  .date{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);font-size:21px;font-weight:800;
       letter-spacing:.42em;text-transform:uppercase;color:#9a7ad6;text-indent:.42em;white-space:nowrap}
  .datebg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:1000px;height:110px;
       background:linear-gradient(180deg,transparent,rgba(12,8,23,.85) 55%)}
