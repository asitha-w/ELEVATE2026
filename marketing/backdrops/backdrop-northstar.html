<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{width:7680px;height:4320px;overflow:hidden}
  body{width:1920px;height:1080px;overflow:hidden;transform:scale(4);transform-origin:0 0;
       font-family:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;color:#fff;position:relative}

  body{background:#171029}
  svg.art{position:absolute;inset:0}
  .core{position:absolute;left:50%;top:470px;width:200px;height:200px;transform:translate(-50%,-50%);
       background:linear-gradient(180deg,#fff,#9a7ad6);
       clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);
       filter:drop-shadow(0 0 70px rgba(169,136,236,.9))}
  .ring{position:absolute;left:50%;top:470px;width:560px;height:560px;transform:translate(-50%,-50%);
       border:2.5px solid rgba(203,184,242,.5);border-radius:50%}
  .ring.r2{width:820px;height:820px;border-color:rgba(143,111,224,.28);border-style:dashed}
  .logo{position:absolute;left:50%;top:88px;transform:translateX(-50%);width:560px}
  .logo img{width:100%}
  .tag{position:absolute;left:50%;top:812px;transform:translateX(-50%);font-size:27px;font-weight:800;
      letter-spacing:.5em;text-transform:uppercase;color:#e6ddf7;text-indent:.5em;white-space:nowrap}
  .pillars{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);display:flex;gap:64px;align-items:center;white-space:nowrap}
  .pl{font-size:30px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;color:#cbb8f2;text-indent:.34em}
  .sep{width:16px;height:16px;background:#9a7ad6;
      clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
  .foot{position:absolute;right:96px;bottom:52px;font-size:19px;font-weight:700;letter-spacing:.3em;
       text-transform:uppercase;color:#6f5b9e}
</style></head><body>
