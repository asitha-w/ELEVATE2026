<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{width:7680px;height:4320px;overflow:hidden}
  body{width:1920px;height:1080px;overflow:hidden;transform:scale(4);transform-origin:0 0;
       font-family:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;color:#fff;position:relative}

  body{background:linear-gradient(115deg,#0d0917 0%,#1c1233 55%,#2b1a52 100%)}
  .halft{position:absolute;right:-140px;top:-140px;width:1250px;height:1250px;border-radius:50%;
        background-image:radial-gradient(circle,rgba(180,150,240,.5) 3.2px,transparent 4px);
        background-size:34px 34px;
        -webkit-mask-image:radial-gradient(circle at 72% 30%,#000 0%,transparent 62%);
                mask-image:radial-gradient(circle at 72% 30%,#000 0%,transparent 62%)}
  .glow{position:absolute;left:-260px;bottom:-300px;width:1300px;height:1300px;border-radius:50%;
       background:radial-gradient(circle,rgba(122,79,192,.35) 0%,transparent 65%)}
  .logo{position:absolute;left:96px;top:78px;width:420px}
  .logo img{width:100%}
  .type{position:absolute;left:96px;top:330px}
  .l1{font-size:150px;font-weight:800;letter-spacing:.01em;line-height:1.02;text-transform:uppercase;
     color:transparent;-webkit-text-stroke:3.5px #cbb8f2}
  .l2{font-size:150px;font-weight:800;letter-spacing:.01em;line-height:1.06;text-transform:uppercase;
     background:linear-gradient(95deg,#fff 20%,#a988ec 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:34px;font-size:26px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#b9a3e8;text-indent:.02em}
  .gate{position:absolute;right:492px;top:0;bottom:0;width:5px;
       background:linear-gradient(180deg,transparent,#a988ec 22%,#fff 50%,#a988ec 78%,transparent);
       box-shadow:0 0 46px 8px rgba(169,136,236,.65)}
  .robot{position:absolute;right:70px;bottom:0;width:400px}
  .robot img{width:100%;display:block;filter:drop-shadow(-30px 0 80px rgba(169,136,236,.4))}
  .date{position:absolute;left:96px;bottom:64px;font-size:22px;font-weight:800;letter-spacing:.42em;
       text-transform:uppercase;color:#9a7ad6}
</style></head><body>
  <div class="glow"></div><div class="halft"></div>
  <div class="gate"></div>
  <div class="logo"><img src="../logos/elevate-logo-white-purple.png"></div>
  <div class="type">
    <div class="l1">Agents<br>deliver.</div>
    <div class="l2">You decide.</div>
    <div class="sub">Human decision-making at the core</div>
  </div>
  <div class="robot"><img src="../logos/elevate-robot.png"></div>
  <div class="date">Elevate 2026 · Fri 7 Aug · 99x Colombo</div>
</body></html>
